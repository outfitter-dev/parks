name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests drop superseded runs; main never cancels one, so a deploy always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # cf loads cloudflare.config.ts with Node module hooks (22.15 or later); pin it like release.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - run: ./scripts/bootstrap.sh
      - run: bun run check
      - run: bun run check:consumer
      # Builds the static site and checks the Worker config; never deploys.
      - name: Cloudflare deploy (dry run)
        env:
          CF_SEND_TELEMETRY: "false"
        run: bun run deploy:check
      # Report-only: contrast findings warn but do not block a merge.
      - name: Contrast (report only)
        continue-on-error: true
        run: |
          bunx playwright-core install --with-deps chromium-headless-shell
          bun run check:contrast

  # Publishes parks.outfitter.dev once main passes its checks. The account comes
  # from cloudflare.config.ts; the token is limited to this Worker's account and zone.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-parks
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # cf loads cloudflare.config.ts with Node module hooks (22.15 or later); pin it like release.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - run: ./scripts/bootstrap.sh
      # cf is the pinned dev dependency (package.json), not a global install.
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

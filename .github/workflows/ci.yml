name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: ./scripts/bootstrap.sh
      - run: bun run check
      - run: bun run check:consumer
      # Builds the static site and checks the Worker config; never deploys.
      - name: Cloudflare deploy (dry run)
        env:
          CF_SEND_TELEMETRY: "false"
        run: bun run deploy:check
      # Report-only: contrast findings warn but do not block a merge.
      - name: Contrast (report only)
        continue-on-error: true
        run: |
          bunx playwright-core install --with-deps chromium-headless-shell
          bun run check:contrast

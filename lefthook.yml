# Git hooks for plain-Git use of this repository. jj does not run Git hooks;
# in a jj workspace run `bun run check` before pushing. `climb commit` runs the
# same command through climb.yaml.
#
# GIT_PAGER=cat keeps pager-triggering Git commands from hanging in lefthook's PTY.

pre-push:
  commands:
    check:
      run: bun run check
      env:
        GIT_PAGER: cat
